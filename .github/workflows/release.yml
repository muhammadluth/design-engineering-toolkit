name: Package reviewed plugin
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python scripts/build.py
          python scripts/validate.py
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-plugin-package
          path: |
            dist/design-engineering-toolkit.zip
            dist/SHA256SUMS
