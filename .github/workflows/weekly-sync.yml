name: Weekly upstream skill sync
on:
  schedule:
    - cron: '0 1 * * 5' # Friday 08:00 Asia/Jakarta
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch upstream
        run: python scripts/sync.py
      - name: Validate and package
        run: |
          python scripts/build.py
          python scripts/validate.py
      - name: Create auditable update PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            upstream/
            sources.lock.json
          commit-message: 'chore(skills): sync upstream snapshots'
          branch: automation/weekly-skills-sync
          delete-branch: true
          title: 'chore: review weekly upstream design skill updates'
          body: |
            Review source commit SHAs, license and untrusted instruction changes before merging.
            This PR does not deploy to ChatGPT.
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-plugin
          path: |
            dist/design-engineering-toolkit.zip
            dist/SHA256SUMS
            sources.lock.json
          if-no-files-found: error
